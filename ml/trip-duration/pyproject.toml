[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cabrynt-trip-duration"
version = "0.1.0"
description = "Trip duration prediction pipeline for Cabrynt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.0.0",
    "holidays>=0.80",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
