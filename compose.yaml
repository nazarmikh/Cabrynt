name: cabrynt

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: cabrynt-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__DatabaseName: ${Mongo__DatabaseName}
      JwtToken: ${JwtToken}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes}
      Admin__Email: ${Admin__Email}
      Admin__Password: ${Admin__Password}
      Email__FromAddress: ${Email__FromAddress}
      Email__PickupDirectory: ${Email__PickupDirectory:-}
      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__SmtpUsername: ${Email__SmtpUsername}
      Email__SmtpPassword: ${Email__SmtpPassword}
      Email__UseSsl: ${Email__UseSsl}
    ports:
      - "5113:8080"
    volumes:
      - ./src/backend/GeneratedEmails:/app/GeneratedEmails
      - ./src/backend/GeneratedInvoices:/app/GeneratedInvoices
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5113
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:5113/graphql
    container_name: cabrynt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5113
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:5113/graphql
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  telemetry-simulator:
    image: mcr.microsoft.com/powershell:7.5-ubuntu-24.04
    container_name: cabrynt-telemetry-simulator
    restart: unless-stopped
    working_dir: /workspace
    command:
      - pwsh
      - -File
      - /workspace/scripts/simulate-telemetry.ps1
      - -ConfigPath
      - /workspace/scripts/vehicle-simulator.docker.config.json
    volumes:
      - ./scripts:/workspace/scripts:ro
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: cabrynt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cabrynt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: cabrynt-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: cabrynt-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
