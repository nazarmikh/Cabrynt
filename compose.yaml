name: cabrynt

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: cabrynt-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__DatabaseName: ${Mongo__DatabaseName}
      JwtToken: ${JwtToken}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes}
      Admin__Email: ${Admin__Email}
      Admin__Password: ${Admin__Password}
      Email__FromAddress: ${Email__FromAddress}
      Email__PickupDirectory: ${Email__PickupDirectory:-}
      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__SmtpUsername: ${Email__SmtpUsername}
      Email__SmtpPassword: ${Email__SmtpPassword}
      Email__UseSsl: ${Email__UseSsl}
      DataProtection__ApplicationName: ${DataProtection__ApplicationName:-Cabrynt}
      DataProtection__KeyDirectory: ${DataProtection__KeyDirectory:-/app/App_Data/data-protection-keys}
      Routing__OsrmBaseUrl: ${Routing__OsrmBaseUrl:-}
      Routing__UserAgent: ${Routing__UserAgent:-Cabrynt/1.0 (+https://github.com/nazarmikh/Cabrynt)}
      Routing__RequestTimeoutSeconds: ${Routing__RequestTimeoutSeconds:-3}
      TripDurationModel__Enabled: ${TripDurationModel__Enabled:-false}
      TripDurationModel__ModelPath: ${TripDurationModel__ModelPath:-}
      TripDurationModel__ModelArtifactUrl: ${TripDurationModel__ModelArtifactUrl:-}
      TripDurationModel__MetadataUrl: ${TripDurationModel__MetadataUrl:-}
      TripDurationModel__ExpectedVersion: ${TripDurationModel__ExpectedVersion:-1.0.0}
      TripDurationModel__CacheDirectory: ${TripDurationModel__CacheDirectory:-/app/App_Data/models}
      TripDurationModel__DownloadTimeoutSeconds: ${TripDurationModel__DownloadTimeoutSeconds:-15}
      Weather__Enabled: ${Weather__Enabled:-false}
      Weather__BaseUrl: ${Weather__BaseUrl:-https://api.open-meteo.com/}
      Weather__RequestTimeoutSeconds: ${Weather__RequestTimeoutSeconds:-3}
      Weather__CacheDurationMinutes: ${Weather__CacheDurationMinutes:-10}
    ports:
      - "5113:8080"
    volumes:
      - ./src/backend/GeneratedEmails:/app/GeneratedEmails
      - ./src/backend/GeneratedInvoices:/app/GeneratedInvoices
      - trip_duration_models:/app/App_Data/models
      - data_protection_keys:/app/App_Data/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  osrm-download:
    image: curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    profiles: ["routing"]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -s /data/portugal-latest.osm.pbf ]; then
          exit 0
        fi
        curl --fail --location --retry 3 --retry-delay 5 \
          --output /data/portugal-latest.osm.pbf \
          https://download.geofabrik.de/europe/portugal-latest.osm.pbf
    volumes:
      - osrm_data:/data

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    profiles: ["routing"]
    restart: "no"
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ -f /data/portugal-latest.osrm.mldgr ]; then
          exit 0
        fi
        osrm-extract -p /opt/car.lua /data/portugal-latest.osm.pbf
        osrm-partition /data/portugal-latest.osrm
        osrm-customize /data/portugal-latest.osrm
    volumes:
      - osrm_data:/data

  osrm:
    image: ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    profiles: ["routing"]
    container_name: cabrynt-osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/portugal-latest.osrm"]
    ports:
      - "127.0.0.1:${OSRM_PORT:-5001}:5000"
    volumes:
      - osrm_data:/data:ro
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5113
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:5113/graphql
    container_name: cabrynt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5113
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:5113/graphql
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  telemetry-simulator:
    image: mcr.microsoft.com/powershell:7.5-ubuntu-24.04
    container_name: cabrynt-telemetry-simulator
    restart: unless-stopped
    working_dir: /workspace
    command:
      - pwsh
      - -File
      - /workspace/scripts/simulate-telemetry.ps1
      - -ConfigPath
      - /workspace/scripts/vehicle-simulator.docker.config.json
    volumes:
      - ./scripts:/workspace/scripts:ro
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: cabrynt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cabrynt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: cabrynt-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: cabrynt-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  trip_duration_models:
  data_protection_keys:
  osrm_data:
