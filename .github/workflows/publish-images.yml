name: Publish Container Images

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'src/osrm/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cabrynt-backend
  OSRM_IMAGE: ghcr.io/${{ github.repository_owner }}/cabrynt-osrm

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: Build and publish OSRM
        uses: docker/build-push-action@v6
        with:
          context: src/osrm
          file: src/osrm/Dockerfile
          push: true
          tags: ${{ env.OSRM_IMAGE }}:sha-${{ github.sha }}
