name: ML CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/trip-duration/requirements.txt

      - name: Install dependencies
        working-directory: ml/trip-duration
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ml/trip-duration
        run: python -m pytest tests -q
