name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: CabryntPostgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d CabryntPostgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=CabryntPostgres;Username=postgres;Password=change-me
      ConnectionStrings__Mongo: mongodb://localhost:27017
      Mongo__DatabaseName: CabryntMongo
      JwtToken: change-me-to-a-long-random-secret-for-ci
      Jwt__Issuer: Cabrynt
      Jwt__Audience: CabryntClient
      Jwt__ExpiryMinutes: 60
      Admin__Email: admin@cabrynt.test
      Admin__Password: AdminPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cabrynt.sln

      - name: Check formatting
        run: dotnet format Cabrynt.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Cabrynt.sln --no-restore

      - name: Unit tests
        run: dotnet test tests/backend.UnitTests/backend.UnitTests.csproj --no-build

      - name: Integration tests
        run: dotnet test tests/backend.IntegrationTests/backend.IntegrationTests.csproj --no-build

      - name: Audit dependencies
        run: dotnet list Cabrynt.sln package --vulnerable --include-transitive

  docker-images:
    runs-on: ubuntu-latest
    needs: build-test

    env:
      POSTGRES_DB: CabryntPostgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_PORT: 5432
      PGADMIN_PORT: 5050
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: change-me
      MONGO_PORT: 27017
      MONGO_EXPRESS_PORT: 8081
      MONGO_EXPRESS_USERNAME: admin
      MONGO_EXPRESS_PASSWORD: change-me
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=CabryntPostgres;Username=postgres;Password=change-me
      ConnectionStrings__Mongo: mongodb://localhost:27017
      Mongo__DatabaseName: CabryntMongo
      JwtToken: change-me-to-a-long-random-secret-for-ci
      Jwt__Issuer: Cabrynt
      Jwt__Audience: CabryntClient
      Jwt__ExpiryMinutes: 60
      Admin__Email: admin@cabrynt.test
      Admin__Password: AdminPassword123!
      Email__FromAddress: no-reply@cabrynt.test
      Email__PickupDirectory: GeneratedEmails
      Email__SmtpHost: smtp.example.com
      Email__SmtpPort: 587
      Email__SmtpUsername: change-me
      Email__SmtpPassword: change-me
      Email__UseSsl: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build backend frontend
